# Runs on pull requests to main, pushes to main, a weekly schedule and manual
# runs. The jobs run in parallel:
#
#   lint      pre-commit, always
#   metadata  benchmark metadata and results checks
#   runner    runner unit tests, campaign generator and a sample benchmark run
#   website   website lint, build and accessibility checks
#
# On pull requests, the `changes` job skips metadata, runner and website unless
# the PR touches their files (see the paths in that job). All other triggers,
# and any change to the workflows themselves, run every job.
#
# The final `CI` job is the one branch protection requires: it passes when
# every other job passed or was skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catches drift that no change triggers, e.g. a benchmark URL that stops
  # resolving.
  schedule:
    - cron: "0 12 * * 5" # Fridays at 12:00 UTC, same as CodeQL
  workflow_dispatch:

# A new push to a PR cancels its run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Setting bash explicitly also enables pipefail, so `cmd | tee log` fails the
# step when cmd fails.
defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.filter.outputs.metadata }}
      runner: ${{ steps.filter.outputs.runner }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the areas this change touches
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            for area in metadata runner website; do
              echo "${area}=true" >> "${GITHUB_OUTPUT}"
            done
            exit 0
          fi

          changed=$(git diff --name-only "${BASE_SHA}"...HEAD)
          echo "Changed files:"
          echo "${changed}"

          # Changes to the workflows match every area.
          workflows='^\.github/workflows/'
          pixi='^pixi\.(toml|lock)$'
          matches() {
            if echo "${changed}" | grep -qE "$1|${workflows}"; then echo true; else echo false; fi
          }
          {
            echo "metadata=$(matches "^benchmarks/|^results/|^tests/validate_|${pixi}")"
            echo "runner=$(matches "^runner/|^benchmarks/[^/]+\.(py|yaml)$|^results/metadata(_subset)?\.yaml$|^tests/sample_benchmarks/|^pytest\.ini$|${pixi}")"
            # The website build reads results/.
            echo "website=$(matches "^website/|^results/")"
          } | tee -a "${GITHUB_OUTPUT}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for comparing against origin/main

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev

      - name: Run pre-commit
        # Checks only the changed files, unless the linter config changed,
        # since that applies to every file.
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(\.pre-commit-config\.yaml|ruff\.toml)$'; then
            pixi run -e dev pre-commit run --show-diff-on-failure --all-files
          else
            pixi run -e dev pre-commit run --show-diff-on-failure --from-ref origin/main --to-ref HEAD
          fi

  metadata:
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev benchmarks

      - name: Check benchmark URL format
        run: |
          pixi run -e benchmarks python tests/validate_urls.py
          if ! git diff --quiet; then
            git diff
            echo "ERROR: benchmark URLs don't match the expected format. Run:"
            echo "pixi run -e benchmarks python tests/validate_urls.py"
            exit 1
          fi

      - name: Check merged metadata is up to date
        run: |
          pixi run -e benchmarks python benchmarks/merge_metadata.py 2>&1 | tee merge_metadata.log
          if grep -i "warning" merge_metadata.log; then
            echo "ERROR: merge_metadata.py produced warnings."
            exit 1
          fi
          if ! git diff --quiet; then
            git diff
            echo "ERROR: results/metadata.yaml is out of date. Run:"
            echo "pixi run -e benchmarks python benchmarks/merge_metadata.py"
            exit 1
          fi

      - name: Validate metadata schema
        run: pixi run -e dev yamale -s benchmarks/metadata_schema.yaml results/metadata.yaml

      - name: Check benchmark URLs exist
        run: pixi run -e benchmarks python tests/validate_urls_exist.py results/metadata.yaml

      - name: Validate results against metadata
        run: pixi run -e benchmarks python tests/validate_results.py

  runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: runner benchmarks

      - name: Run runner unit tests
        run: pixi run -e runner pytest runner/tests -v

      - name: Check campaign generator
        # Uses the benchmarks env and the shipped config, so incompatible
        # syntax or a stale config schema fails here.
        run: |
          pixi run -e benchmarks python benchmarks/create_benchmark_campaign.py \
            --configfile benchmarks/config.campaign.default.yaml \
            --campaign ci-check --skip-prepare < /dev/null

      - name: Run sample benchmarks
        run: |
          SOLVER_CONFIGURATIONS="cbc-default glpk-default highs-default scip-default"
          SOLVER_ARGS=()
          for configuration in ${SOLVER_CONFIGURATIONS}; do
            SOLVER_ARGS+=(--solver-configurations "${configuration}")
          done
          pixi run -e runner python -m runner.benchmark --years tests \
            "${SOLVER_ARGS[@]}" results/metadata_subset.yaml
          echo ""
          cat results/benchmark_results.csv

          # Require at least one row, every row "ok" (column 5 is Status), and
          # at least one row per requested solver configuration.
          if awk -F',' -v expected="${SOLVER_CONFIGURATIONS}" '
            NR > 1 { rows++; seen[$2] = 1; if ($5 != "ok") failed = 1 }
            END {
              n = split(expected, configurations, " ")
              for (i = 1; i <= n; i++) {
                if (!(configurations[i] in seen)) {
                  print "No results for " configurations[i]
                  missing = 1
                }
              }
              exit(rows == 0 || failed || missing)
            }' results/benchmark_results.csv; then
            echo "All benchmarks ran successfully."
          else
            echo "ERROR: some benchmarks didn't complete successfully."
            exit 1
          fi

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Check reCAPTCHA key is configured
        # Skipped for PRs from forks and Dependabot, which don't get secrets.
        if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]')) }}
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" ]; then
            echo "ERROR: NEXT_PUBLIC_RECAPTCHA_SITE_KEY is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The Next.js build doesn't run ESLint.
        run: npm run lint

      - name: Build
        # The only step that gets the website's secrets.
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Install Chrome and a matching ChromeDriver
        # Chrome for Testing with the ChromeDriver of the same version. Exports
        # both paths for the accessibility tests.
        run: |
          npx --yes browser-driver-manager@2.0.1 install chrome
          source ~/.browser-driver-manager/.env
          echo "CHROME_BIN_PATH=${CHROME_TEST_PATH}" >> "${GITHUB_ENV}"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_TEST_PATH}" >> "${GITHUB_ENV}"
          "${CHROME_TEST_PATH}" --version
          "${CHROMEDRIVER_TEST_PATH}" --version

      - name: Start Next.js server in background
        run: npm start &

      - name: Wait for server to be ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done' || exit 1

      - name: Extract URLs from sitemap
        run: npm run axe:extract

      - name: Run axe-core accessibility tests on all pages
        env:
          AXE_CHROME_OPTIONS: "no-sandbox,disable-dev-shm-usage,disable-setuid-sandbox,headless=new,disable-gpu"
          AXE_LOAD_DELAY: "5000"
          # Google's reCAPTCHA widget is third-party content we can't fix.
          AXE_EXCLUDE: "iframe[title=reCAPTCHA]"
        run: |
          export CHROME_BIN="$CHROME_BIN_PATH"
          echo "Using CHROME_BIN=$CHROME_BIN"
          npm run axe:test

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: website/axe-results.json

  ci:
    name: CI
    if: always()
    needs: [changes, lint, metadata, runner, website]
    runs-on: ubuntu-latest
    steps:
      - name: Check the other jobs' results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "ERROR: a job ended with '${result}'."
              exit 1
            fi
          done
