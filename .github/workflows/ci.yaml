name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full run, to catch drift that no single change triggers (e.g. a
  # benchmark URL that stops resolving, or an upstream package change)
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Explicit bash also turns on pipefail, so e.g. `cmd | tee log` fails the step
# when cmd fails
defaults:
  run:
    shell: bash

jobs:
  # Decide which areas a PR touches. Pushes to main, the weekly schedule and
  # manual runs check every area.
  changes:
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.filter.outputs.metadata }}
      runner: ${{ steps.filter.outputs.runner }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            for area in metadata runner website; do
              echo "${area}=true" >> "${GITHUB_OUTPUT}"
            done
            exit 0
          fi

          changed=$(git diff --name-only "${BASE_SHA}"...HEAD)
          echo "Changed files:"
          echo "${changed}"

          # A change to the workflows themselves runs every area
          ci='^\.github/workflows/'
          pixi='^pixi\.(toml|lock)$'
          matches() {
            if echo "${changed}" | grep -qE "$1|${ci}"; then echo true; else echo false; fi
          }
          {
            echo "metadata=$(matches "^benchmarks/|^results/|^tests/validate_|${pixi}")"
            echo "runner=$(matches "^runner/|^benchmarks/[^/]+\.(py|yaml)$|^results/metadata(_subset)?\.yaml$|^tests/sample_benchmarks/|^pytest\.ini$|${pixi}")"
            # The website reads results/ at build time
            echo "website=$(matches "^website/|^results/")"
          } | tee -a "${GITHUB_OUTPUT}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pre-commit compares against origin/main

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev

      - name: Run pre-commit
        run: |
          # A change to the linters' own config applies to every file, so check
          # them all; otherwise only the files this change touches.
          if git diff --name-only origin/main...HEAD | grep -qE '^(\.pre-commit-config\.yaml|ruff\.toml)$'; then
            pixi run -e dev pre-commit run --show-diff-on-failure --all-files
          else
            pixi run -e dev pre-commit run --show-diff-on-failure --from-ref origin/main --to-ref HEAD
          fi

  metadata:
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev benchmarks

      - name: Check benchmark URL format
        run: |
          pixi run -e benchmarks python tests/validate_urls.py
          if ! git diff --quiet; then
            git diff
            echo "ERROR: benchmark URLs do not match expected format, please run the following command:"
            echo "pixi run -e benchmarks python tests/validate_urls.py"
            exit 1
          fi

      - name: Check merged metadata is up to date
        run: |
          pixi run -e benchmarks python benchmarks/merge_metadata.py 2>&1 | tee merge_metadata.log
          if grep -i "warning" merge_metadata.log; then
            echo "ERROR: merge_metadata.py produced warnings"
            exit 1
          fi
          if ! git diff --quiet; then
            git diff
            echo "ERROR: metadata needs updating, please run the following command:"
            echo "pixi run -e benchmarks python benchmarks/merge_metadata.py"
            exit 1
          fi

      - name: Validate metadata schema
        run: pixi run -e dev yamale -s benchmarks/metadata_schema.yaml results/metadata.yaml

      - name: Check benchmark URLs exist
        run: pixi run -e benchmarks python tests/validate_urls_exist.py results/metadata.yaml

      - name: Validate results against metadata
        run: pixi run -e benchmarks python tests/validate_results.py

  runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: runner benchmarks

      - name: Run runner unit tests
        run: pixi run -e runner pytest runner/tests -v

      - name: Check campaign generator
        # Runs in the benchmarks env with the shipped config, so
        # incompatible syntax or a stale config schema fails here.
        run: |
          pixi run -e benchmarks python benchmarks/create_benchmark_campaign.py \
            --configfile benchmarks/config.campaign.default.yaml \
            --campaign ci-check --skip-prepare < /dev/null

      - name: Run sample benchmarks
        run: |
          SOLVER_CONFIGURATIONS="cbc-default glpk-default highs-default scip-default"
          SOLVER_ARGS=()
          for configuration in ${SOLVER_CONFIGURATIONS}; do
            SOLVER_ARGS+=(--solver-configurations "${configuration}")
          done
          pixi run -e runner python -m runner.benchmark --years tests \
            "${SOLVER_ARGS[@]}" results/metadata_subset.yaml
          echo ""
          cat results/benchmark_results.csv
          # Require at least one row, every row "ok" (column 5 is Status),
          # and at least one row for each requested solver configuration.
          if awk -F',' -v expected="${SOLVER_CONFIGURATIONS}" '
            NR > 1 { rows++; seen[$2] = 1; if ($5 != "ok") failed = 1 }
            END {
              n = split(expected, configurations, " ")
              for (i = 1; i <= n; i++) {
                if (!(configurations[i] in seen)) {
                  print "No results for " configurations[i]
                  missing = 1
                }
              }
              exit(rows == 0 || failed || missing)
            }' results/benchmark_results.csv; then
            echo "All benchmarks ran successfully."
          else
            echo "Some benchmarks did not complete successfully."
            exit 1
          fi

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Check reCAPTCHA key is configured
        # Secrets aren't available to PRs from forks or Dependabot
        if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]')) }}
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" ]; then
            echo "Error: NEXT_PUBLIC_RECAPTCHA_SITE_KEY is not set"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The build doesn't lint, so run ESLint explicitly
        run: npm run lint

      - name: Build
        # The only step that gets the website's secrets
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Install Google Chrome (for ChromeDriver matching)
        run: |
          # Install Chrome so any driver manager can detect the browser version
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          # Attempt to install Chrome 145.x (pin major version). If unavailable, fall back to stable.
          CHROME_MAJOR=145
          if sudo apt-get install -y "google-chrome-stable=${CHROME_MAJOR}*"; then
            echo "Installed Google Chrome matching major ${CHROME_MAJOR}"
          else
            echo "Requested Chrome ${CHROME_MAJOR} not available via apt; installing stable instead"
            sudo apt-get install -y google-chrome-stable
          fi
          # Print version for debugging
          google-chrome --version || which google-chrome-stable || true

      - name: Install matching ChromeDriver for apt Chrome via browser-driver-manager
        run: |
          npm install --no-save browser-driver-manager
          # Detect the apt-installed Chrome version and ask bdm to install the matching chromedriver
          CHROME_VER=$(google-chrome --version 2>/dev/null | awk '{print $3}' || true)
          echo "Detected Chrome version: $CHROME_VER"
          if [ -n "$CHROME_VER" ]; then
            # Try to install the chromedriver matching the full Chrome version first
            if npx browser-driver-manager install chromedriver --chromedriver-version="$CHROME_VER"; then
              echo "Installed chromedriver matching $CHROME_VER"
            else
              # Fall back to installing chromedriver for the major version
              CHROME_MAJOR=$(echo "$CHROME_VER" | cut -d'.' -f1)
              echo "Falling back to chromedriver for major version: $CHROME_MAJOR"
              npx browser-driver-manager install chromedriver --chromedriver-version="$CHROME_MAJOR" || true
            fi
          else
            echo "Could not detect apt chrome version; installing chromedriver latest as fallback"
            npx browser-driver-manager install chromedriver || true
          fi
          # Resolve the chromedriver binary and export for later steps
          CHROMEDRIVER_PATH=$(npx browser-driver-manager path chromedriver 2>/dev/null || which chromedriver 2>/dev/null || echo "")
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> $GITHUB_ENV
          echo "Installed ChromeDriver at: $CHROMEDRIVER_PATH"
          # Also expose Chrome binary path for tests
          CHROME_BIN_PATH=$(which google-chrome-stable || which google-chrome || echo "")
          echo "CHROME_BIN_PATH=$CHROME_BIN_PATH" >> $GITHUB_ENV
          echo "Chrome binary: $CHROME_BIN_PATH"
          if [ -n "$CHROME_BIN_PATH" ]; then
            $CHROME_BIN_PATH --version || true
          fi
          if [ -n "$CHROMEDRIVER_PATH" ]; then
            $CHROMEDRIVER_PATH --version || true
          fi

      - name: Start Next.js server in background
        run: npm start &

      - name: Wait for server to be ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done' || exit 1

      - name: Extract URLs from sitemap
        run: npm run axe:extract

      - name: Run axe-core accessibility tests on all pages
        env:
          # AXE flags
          AXE_CHROME_OPTIONS: "no-sandbox,disable-dev-shm-usage,disable-setuid-sandbox,headless=new,disable-gpu"
          AXE_LOAD_DELAY: "5000"
        run: |
          # CHROME_BIN_PATH is set earlier into GITHUB_ENV; export it for the test
          export CHROME_BIN="$CHROME_BIN_PATH"
          echo "Using CHROME_BIN=$CHROME_BIN"
          npm run axe:test

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: website/axe-results.json
