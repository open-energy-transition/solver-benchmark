# Scans Python, JavaScript/TypeScript and the GitHub Actions workflows
# themselves for security issues with CodeQL. Runs on pull requests to main,
# pushes to main and weekly.
#
# The main branch ruleset requires CodeQL results before a PR can merge, so
# this runs on every PR, without path filters.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 5" # Fridays at 12:00 UTC, same as CI

# A new push to a PR cancels its run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload the results
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # None of these languages needs to be built for analysis.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
