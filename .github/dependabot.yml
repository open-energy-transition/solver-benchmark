version: 2
updates:
  # Group minor/patch bumps into one weekly PR per ecosystem; majors get their own PRs
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    # @types/node follows the Node version the site runs on (22, see
    # "engines" in website/package.json), so only its minor and patch
    # updates are wanted
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Each package goes to the first group that matches it
    groups:
      # Packages that only work at matching versions, so their updates, majors
      # included, always come together in one PR
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      website-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
