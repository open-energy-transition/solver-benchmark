# Dependabot keeps the website's npm packages (website/) and the GitHub Actions
# used by the workflows up to date, with weekly version updates:
#
# - npm: all minor and patch updates are grouped into one PR. Major updates of
#   packages that only work at matching versions arrive together in one PR:
#   React with its type packages, and Next.js with its ESLint config. Other
#   major updates arrive as separate PRs, since they may need code changes.
# - GitHub Actions: all updates are grouped into one PR.
#
# Security updates (switched on in the repository settings, not here) fix
# vulnerable dependencies, including indirect ones that version updates never
# touch. Fixes that only need a minor or patch update are grouped into one PR
# per ecosystem. Fixes that need a major update arrive separately, so a
# breaking upgrade cannot hold back the others.
version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    # Each update goes to the first group that accepts it, so the groups below
    # website-minor-patch only receive major updates. website-minor-patch has
    # no patterns on purpose: it covers every package that way, while
    # patterns: ["*"] would let the more specific react and next groups take
    # their minor and patch updates
    groups:
      website-minor-patch:
        update-types: [minor, patch]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      website-security:
        applies-to: security-updates
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        update-types: [minor, patch]
        patterns: ["*"]
