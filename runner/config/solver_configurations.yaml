# Tuning options for each solver configuration, resolved by
# runner/utils/config.py's get_solver_options() and passed to linopy's
# solver constructors. Fixes a random seed and sets tolerances as similar as
# possible, so results are comparable and reproducible.
#
# `shared`: target values common to multiple configurations (the MIP gap
# tolerance, the LP feasibility/optimality tolerance) -- referenced via
# `{shared: <name>}` rather than repeating the literal value everywhere.
#
# `configurations`: one entry per named way of running a solver package, run
# and reported as its own row (e.g. "highs" is HiGHS with its default
# algorithm selection, "highs-hipo" is HiGHS with HiPO selected via its own
# "solver" option; a future "gurobi-barrier" would be Gurobi with its
# barrier method selected via "Method"). Every entry has:
#   - `solver`: the underlying solver package that actually runs it
#     (linopy's solver class name) -- always present, even when it equals
#     the configuration's own name (e.g. "highs"'s `solver` is "highs").
#   - `options`: that configuration's tuning options, in the solver
#     package's own option-key vocabulary (hence the very different-looking
#     names for the same underlying setting, e.g. HiGHS's "mip_rel_gap" vs
#     Gurobi's "MIPGap" vs CPLEX's "mip.tolerances.mipgap" all reference
#     `shared.mip_gap`). Seed values are NOT unified across solvers --
#     GLPK/SCIP default to 0, CBC to 1 (0 means "time of day" for CBC
#     specifically), the rest to 4 -- preserved as-is rather than
#     homogenized here. A non-default configuration's `options` entirely
#     replace its solver's default-configuration options (rather than
#     layering on top), matching how picking a specific algorithm is an
#     all-or-nothing choice.
#
# Adding a new algorithm configuration for an existing solver (or a first one
# for a solver that doesn't have any yet) is a new entry here, not new
# Python code.
#
# `default_configurations`: the solver configurations to run when the CLI is
# given none explicitly -- names of entries in `configurations` below (e.g.
# could list "highs-hipo" as a default).
shared:
  mip_gap: 1.0e-4
  lp_tolerance: 1.0e-6

default_configurations: [highs, scip, cbc, gurobi, glpk]

configurations:
  glpk:
    solver: glpk
    options:
      seed: 0
      mipgap: { shared: mip_gap }

  scip:
    solver: scip
    options:
      randomization/randomseedshift: 0
      limits/gap: { shared: mip_gap }

  cbc:
    solver: cbc
    options:
      randomCbcSeed: 1 # 0 indicates time of day
      ratioGap: { shared: mip_gap }

  highs:
    solver: highs
    options:
      random_seed: 4
      mip_rel_gap: { shared: mip_gap }
      primal_feasibility_tolerance: { shared: lp_tolerance }
      dual_feasibility_tolerance: { shared: lp_tolerance }
      run_crossover: choose # Basic solutions not needed

  highs-hipo:
    solver: highs
    options:
      solver: hipo
      hipo_block_size: 64
      run_crossover: choose
      random_seed: 0
      mip_rel_gap: { shared: mip_gap }

  highs-hipo-32:
    solver: highs
    options:
      solver: hipo
      hipo_block_size: 32
      run_crossover: choose
      random_seed: 0
      mip_rel_gap: { shared: mip_gap }

  highs-hipo-64:
    solver: highs
    options:
      solver: hipo
      hipo_block_size: 64
      run_crossover: choose
      random_seed: 0
      mip_rel_gap: { shared: mip_gap }

  highs-hipo-128:
    solver: highs
    options:
      solver: hipo
      hipo_block_size: 128
      run_crossover: choose
      random_seed: 0
      mip_rel_gap: { shared: mip_gap }

  highs-ipm:
    solver: highs
    options:
      solver: ipx
      run_crossover: choose
      random_seed: 0
      mip_rel_gap: { shared: mip_gap }

  gurobi:
    solver: gurobi
    options:
      seed: 4
      MIPGap: { shared: mip_gap }
      FeasibilityTol: { shared: lp_tolerance }
      OptimalityTol: { shared: lp_tolerance }
      # BarConvTol: { shared: lp_tolerance }  # TODO also set BarConvTol for all solvers?
      SolutionTarget: 1 # Basic solutions not needed

  cplex:
    solver: cplex
    options:
      randomseed: 4
      mip.tolerances.mipgap: { shared: mip_gap }
      simplex.tolerances.feasibility: { shared: lp_tolerance }
      simplex.tolerances.optimality: { shared: lp_tolerance }
      solutiontype: 2 # Basic solutions not needed

  knitro:
    solver: knitro
    options:
      ms_seed: 4
      mip_opt_gap_rel: { shared: mip_gap }
      feastol: { shared: lp_tolerance }
      opttol: { shared: lp_tolerance }
      bar_maxcrossit: 0 # Basic solutions not needed (no way to say choose)

  xpress:
    solver: xpress
    options:
      randomseed: 4
      miprelstop: { shared: mip_gap }
      FEASTOL: { shared: lp_tolerance }
      OPTIMALITYTOL: { shared: lp_tolerance }
      crossover: -1 # Basic solutions not needed (crossover=choose)

  mosek:
    solver: mosek
    options:
      MSK_IPAR_MIO_SEED: 4
      MSK_IPAR_INTPNT_BASIS: MSK_BI_NEVER
      MSK_DPAR_MIO_TOL_REL_GAP: { shared: mip_gap }
      MSK_DPAR_INTPNT_TOL_PFEAS: { shared: lp_tolerance }
      MSK_DPAR_INTPNT_TOL_DFEAS: { shared: lp_tolerance }
