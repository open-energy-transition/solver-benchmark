# Per-solver tuning options, resolved by runner/utils/config.py's
# get_solver_options() and passed to linopy's solver constructors. Fixes a
# random seed and sets tolerances as similar as possible across solvers, so
# results are comparable and reproducible.
#
# `shared`: target values that are the same for every solver (the MIP gap
# tolerance, the LP feasibility/optimality tolerance) -- referenced from a
# solver's own options via `{shared: <name>}` rather than repeating the
# literal value in each solver's block.
#
# `solvers`: each solver's actual option keys, as accepted by its own Python
# API (hence the very different-looking names for the same underlying
# setting, e.g. HiGHS's "mip_rel_gap" vs Gurobi's "MIPGap" vs CPLEX's
# "mip.tolerances.mipgap" all reference `shared.mip_gap`). Values that are
# genuinely solver-specific (seeds, "don't compute a crossover/basic solution
# since we don't need one") are written as literals. Seed values are NOT
# unified across solvers -- GLPK/SCIP default to 0, CBC to 1 (0 means "time of
# day" for CBC specifically), the rest to 4 -- preserved as-is from the
# original per-solver tuning rather than homogenized here.
shared:
  mip_gap: 1.0e-4
  lp_tolerance: 1.0e-6

solvers:
  glpk:
    seed: 0
    mipgap: { shared: mip_gap }

  scip:
    randomization/randomseedshift: 0
    limits/gap: { shared: mip_gap }

  cbc:
    randomCbcSeed: 1 # 0 indicates time of day
    ratioGap: { shared: mip_gap }

  highs:
    random_seed: 4
    mip_rel_gap: { shared: mip_gap }
    primal_feasibility_tolerance: { shared: lp_tolerance }
    dual_feasibility_tolerance: { shared: lp_tolerance }
    run_crossover: choose # Basic solutions not needed

  gurobi:
    seed: 4
    MIPGap: { shared: mip_gap }
    FeasibilityTol: { shared: lp_tolerance }
    OptimalityTol: { shared: lp_tolerance }
    # BarConvTol: { shared: lp_tolerance }  # TODO also set BarConvTol for all solvers?
    SolutionTarget: 1 # Basic solutions not needed

  cplex:
    randomseed: 4
    mip.tolerances.mipgap: { shared: mip_gap }
    simplex.tolerances.feasibility: { shared: lp_tolerance }
    simplex.tolerances.optimality: { shared: lp_tolerance }
    solutiontype: 2 # Basic solutions not needed

  knitro:
    ms_seed: 4
    mip_opt_gap_rel: { shared: mip_gap }
    feastol: { shared: lp_tolerance }
    opttol: { shared: lp_tolerance }
    bar_maxcrossit: 0 # Basic solutions not needed (no way to say choose)

  xpress:
    randomseed: 4
    miprelstop: { shared: mip_gap }
    FEASTOL: { shared: lp_tolerance }
    OPTIMALITYTOL: { shared: lp_tolerance }
    crossover: -1 # Basic solutions not needed (crossover=choose)

  mosek:
    MSK_IPAR_MIO_SEED: 4
    MSK_IPAR_INTPNT_BASIS: MSK_BI_NEVER
    MSK_DPAR_MIO_TOL_REL_GAP: { shared: mip_gap }
    MSK_DPAR_INTPNT_TOL_PFEAS: { shared: lp_tolerance }
    MSK_DPAR_INTPNT_TOL_DFEAS: { shared: lp_tolerance }
