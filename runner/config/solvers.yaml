# Solver registry consumed by runner/utils/config.py.
#
# `solvers`: per solver, per version, the release year and the per-solver-year
# env (a pixi manifest directory at runner/envs/<env>/) that provides it. The
# version listed for a given year is the latest release of that solver
# available in that year, not necessarily the version it was first released.
#
# `packages`: the PyPI package name for each solver, where it differs
# from the solver's own name (used to cross-check what's actually installed
# in an env against what this file expects).
#
# `tests`: not a release year -- the versions actually pinned in
# runner/envs/benchmark-tests/pixi.toml, the single shared env CI solves
# real problems in as a smoke test (year "tests"). Kept separate from
# `solvers` rather than as another per-solver version entry, since the same
# version can legitimately appear in both a per-year env and this shared one
# (e.g. highs 1.9.0 is both 2024's own env and this one).
solvers:
  glpk:
    "5.0":
      year: 2020
      env: benchmark-glpk-2020

  highs:
    "1.5.0.dev0":
      year: 2022
      env: benchmark-highs-2022
    "1.6.0":
      year: 2023
      env: benchmark-highs-2023
    "1.9.0":
      year: 2024
      env: benchmark-highs-2024
    "1.12.0":
      year: 2025
      env: benchmark-highs-2025
    "1.15.1":
      year: 2026
      env: benchmark-highs-2026

  scip:
    "8.0.3":
      year: 2022
      env: benchmark-scip-2022
    "8.1.0":
      year: 2023
      env: benchmark-scip-2023
    "9.2.0":
      year: 2024
      env: benchmark-scip-2024
    "10.0.0":
      year: 2025
      env: benchmark-scip-2025

  gurobi:
    "10.0.0":
      year: 2022
      env: benchmark-gurobi-2022
    "11.0.0":
      year: 2023
      env: benchmark-gurobi-2023
    "12.0.0":
      year: 2024
      env: benchmark-gurobi-2024
    "13.0.0":
      year: 2025
      env: benchmark-gurobi-2025

  cbc:
    "2.10.11":
      year: 2023
      env: benchmark-cbc-2023
    "2.10.12":
      year: 2024
      env: benchmark-cbc-2024

  cplex:
    "22.1.2.0":
      year: 2025
      env: benchmark-cplex-2025

  mosek:
    "11.0.30":
      year: 2025
      env: benchmark-mosek-2025

  knitro:
    "15.1.0":
      year: 2025
      env: benchmark-knitro-2025

  xpress:
    "9.6.2":
      year: 2025
      env: benchmark-xpress-2025

packages:
  glpk: glpk
  highs: highspy
  scip: scip
  gurobi: gurobi
  cbc: coin-or-cbc
  cplex: cplex
  knitro: knitro
  xpress: xpress
  mosek: mosek

tests:
  highs:
    version: "1.9.0"
    env: benchmark-tests
  scip:
    version: "9.2.1"
    env: benchmark-tests
  cbc:
    version: "2.10.12"
    env: benchmark-tests
  glpk:
    version: "5.0.0"
    env: benchmark-tests
