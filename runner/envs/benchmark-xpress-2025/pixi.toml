# Auto-translated from the old runner/envs/benchmark-xpress-2025.yaml (conda)
# during the conda -> pixi solver-env migration (issue #478 PR5).
[workspace]
name = "benchmark-xpress-2025"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# xpress==9.6.2 has no wheel newer than cp313, so the upper bound is load-
# bearing here, not cosmetic -- a loose ">=3.12" lets the resolver pick
# conda-forge's newest Python (3.14) and fail to find a matching wheel.
python = ">=3.12,<3.14"
pip = "*"
psutil = ">=5.9"
requests = ">=2.32"
linopy = ">=0.5.5"

[pypi-dependencies]
xpress = "==9.6.2"  # last version released in 2025 per PyPI release history
