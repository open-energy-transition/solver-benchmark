# Auto-translated from the old runner/envs/benchmark-highs-2023.yaml (conda)
# during the conda -> pixi solver-env migration (issue #478 PR5).
[workspace]
name = "benchmark-highs-2023"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# HiGHS 1.6.0 is tested up to Python 3.13
python = ">=3.12,<3.14"
pip = "*"
psutil = ">=5.9"
requests = ">=2.32"
# GCC 14: GCC 15 fails on HiGHS 1.6.0's bundled zstr header, which doesn't
# include <cstdint>
cxx-compiler = "==1.11.0"
zlib = "*"
linopy = "==0.10.1"

[pypi-dependencies]
highspy = { git = "https://github.com/ERGO-Code/HiGHS", tag = "v1.6.0" }  # 1.6.0 was never released to PyPI
