[workspace]
name = "solver-benchmark"
description = "Tooling environments for the solver-benchmark repo (runner CLI, notebooks, benchmark metadata scripts, dev tools)"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[feature.runner.dependencies]
python = ">=3.12"
pyyaml = "*"
typer = "*"
pandas = "*"
psutil = "*"
requests = "*"
humanize = "*"

[feature.notebooks.dependencies]
python = ">=3.14"

[feature.notebooks.pypi-dependencies]
gsutil = ">=5.35"
humanize = ">=4.15.0"
ipykernel = ">=7.1.0"
ipython = ">=9.10.0"
jinja2 = ">=3.1.6"
matplotlib = ">=3.10.8"
numpy = ">=2.4.2"
pandas = ">=3.0.0"
pyyaml = ">=6.0.3"
scipy = ">=1.17.1"

[feature.benchmarks.dependencies]
python = "3.9.*"
pyyaml = "*"
"ruamel.yaml" = "*"
requests = "*"
pip = "*"

[feature.benchmarks.pypi-dependencies]
highspy = "==1.9.0"
linopy = ">=0.5.0"
pandas = "*"

[feature.dev.dependencies]
ruff = "*"
pytest = "*"
pre-commit = "*"
mypy = "*"
yamale = "*"

[environments]
runner = ["runner", "dev"]
notebooks = ["notebooks", "dev"]
benchmarks = ["benchmarks", "dev"]
dev = ["dev"]
