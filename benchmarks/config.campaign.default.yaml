# Default configuration for create_benchmark_campaign.py.
# Explicit CLI arguments override values defined here.
#
# Example:
#
# python benchmarks/create_benchmark_campaign.py \
#     --configfile benchmarks/config.campaign.default.yaml \
#     --campaign YYYYMMDD-my-campaign-2-3h

# Campaign name.
#
# The date is added automatically to create the final run ID:
# YYYYMMDD-<campaign>
campaign: test-pypsa

# Execution target.
#
# Accepted values:
# - cloud: generate OpenTofu campaign files under infrastructure/benchmarks/<run-id>/
# - local: generate local benchmark files under infrastructure/local/benchmarks/<run-id>/
#
# In local mode, VM-specific settings such as num_vms, machine_type and zone are ignored.
target: local

selection:
  # Problem selection mode.
  #
  # Exactly one of the following should be active after CLI/config merge:
  # - all
  # - problem

  # Select all problems in results/metadata.yaml.
  #
  # Accepted values:
  # true / false
  all: false

  # Select one or more problems by their exact results/metadata.yaml ID.
  #
  # Accepted values:
  # list of problem IDs, or null
  #
  # Examples:
  # - pypsa-de-elec-2-1h
  # - IESA-Opt-NL-5-3h
  problem:
    - pypsa-de-elec-2-1h

  # Optional filter on the metadata Size field.
  #
  # Accepted values:
  # list containing any of S, M, L, or null
  size: null

  # Include problems marked with "Skip because" in the metadata.
  #
  # Accepted values:
  # true / false
  #
  # If false, skipped problems are excluded automatically.
  do_not_skip: false

allocation:
  # Number of VMs to create for cloud campaigns.
  #
  # Accepted values:
  # positive integer, or null
  #
  # If null:
  # one VM is created per selected problem.
  #
  # Ignored when target is local.
  num_vms: null

  # Metadata column used to balance problems across VMs.
  #
  # Accepted values:
  # any numeric metadata column.
  #
  # Common values:
  # - "Num. variables"
  # - "Num. constraints"
  weight_col: "Num. variables"

  # VM profile for cloud campaigns.
  #
  # Accepted values:
  # - short
  # - long
  # - null
  #
  # If null:
  # S/M -> short
  # L   -> long
  #
  # Ignored when target is local.
  machine_type: null

  # Google Cloud zone for cloud campaigns.
  #
  # Accepted values:
  # any valid GCP zone.
  #
  # Ignored when target is local.
  zone: us-central1-a

  # Solver timeout in hours.
  #
  # Accepted values:
  # positive number, or null
  #
  # If null:
  # S/M -> 1 hour
  # L   -> 24 hours
  timeout_hours: null

  # Solver environment years to benchmark.
  #
  # Accepted values:
  # list of years registered in runner/config/solvers.yaml.
  #
  # Example:
  # - 2025
  years:
    - 2025

  # Solver configurations to benchmark.
  #
  # Accepted values depend on the selected benchmark environment.
  #
  # Typical values (currently included in the website):
  # - gurobi-default
  # - highs-default
  # - scip-default
  # - cbc-default
  # - glpk-default
  solver_configurations:
    - gurobi-default
    - highs-default
    - scip-default
    - cbc-default
    - glpk-default
